# Config for ros_gz_bridge
# Input: Gazebo Harmonic Topics -> Output: ROS 2 Topics

# 1. RGB Camera
- topic_name: /world/maze_harmonic/model/x500_depth_0/link/camera_link/sensor/IMX214/image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS

# 2. Camera Info (Required for ArUco/SLAM)
- topic_name: /world/maze_harmonic/model/x500_depth_0/link/camera_link/sensor/IMX214/camera_info
  ros_type_name: sensor_msgs/msg/CameraInfo
  gz_type_name: gz.msgs.CameraInfo
  direction: GZ_TO_ROS

# 3. Depth Camera
- topic_name: /depth_camera
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS

# 4. Point Cloud (Optional, if you want raw cloud)
- topic_name: /depth_camera/points
  ros_type_name: sensor_msgs/msg/PointCloud2
  gz_type_name: gz.msgs.PointCloudPacked
  direction: GZ_TO_ROS
